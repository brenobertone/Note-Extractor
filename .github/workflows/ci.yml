name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Format Check
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'placeholder' }}

      - name: Unit Tests
        run: npm run test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Wait for Supabase Health
        run: |
          for i in {1..30}; do
            if curl -s -o /dev/null http://127.0.0.1:54321/rest/v1/; then
              echo "Supabase API is healthy!"
              exit 0
            fi
            echo "Waiting for Supabase API... ($i/30)"
            sleep 5
          done
          echo "Supabase API failed to start in time"
          exit 1

      - name: Get Supabase Keys
        id: supabase_keys
        run: |
          # Use jq to extract keys safely from the CLI status
          echo "SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.anon_key')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_KEY=$(supabase status -o json | jq -r '.service_role_key')" >> $GITHUB_ENV

      - name: Integration Tests
        run: npm run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_KEY }}
